name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Prepare binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   cp build/typr                   typr-linux   ;;
            macOS)   cp build/typr                   typr-macos   ;;
            Windows) cp build/Release/typr.exe        typr-windows.exe \
                  || cp build/typr.exe                typr-windows.exe ;;
          esac

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: typr-${{ github.ref_name }}-${{ runner.os }}
          path: typr-*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: typr-${{ github.ref_name }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: typr-*
